baseURL = "https://go-nokogiri.github.io/"
languageCode = "en-us"
title = "go-nokogiri"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.11:1, bright on the dark background 5.86:1.
  base = "#14532d"
  deep = "#0c331b"
  bright = "#16a34a"
  shadow = "rgba(20,83,45,.7)"
  glow = "rgba(20,83,45,.6)"
  wash = "rgba(20,83,45,.10)"
  washDeep = "rgba(12,51,27,.06)"
  chipBg = "#e3f4e9"
  chipBorder = "#b9e3c9"
  chipFg = "#0c331b"
  chipBgDark = "rgba(22,163,74,.14)"
  chipBorderDark = "rgba(22,163,74,.32)"
  chipFgDark = "#7fcc9b"
  statsEnd = "#c7e9d4"
  bandText = "#daf0e2"
  accent = "#14532d"
  accentDark = "#16a34a"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-nokogiri.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-nokogiri"
  label = "GitHub"
